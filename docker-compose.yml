services:
  db:
    image: postgres:17-alpine
    container_name: school-admission-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: school_admission
      POSTGRES_USER: school_admin
      POSTGRES_PASSWORD: school_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U school_admin -d school_admission"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    container_name: school-admission-api
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_HTTP_PORTS: 8080
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=school_admission;Username=school_admin;Password=school_dev_password"
      HOLD_DURATION_SECONDS: ${HOLD_DURATION_SECONDS:-600}
    depends_on:
      db:
        condition: service_healthy

  frontend:
    container_name: school-admission-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:8080
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data:
